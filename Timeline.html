<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Day Timeline</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css">
    <style>
        .timeline-item:hover {
            background-color: #a4d1f8;
        }
        .timeline-marker {
            background-color: #ff69b4;
        }
    </style>
</head>
<body>

<section class="section">
    <div class="container">
        <h1 class="title has-text-centered">Wedding Day Timeline</h1>
        <p class="subtitle has-text-centered">June 27th, 2025 at Sand Castle - 505 Franklin Ave, Franklin Square, NY 11010</p>
        <div class="timeline is-centered">
            
            <!-- Hospitality -->
            <div class="timeline-item">
                <div class="timeline-marker"></div>
                <div class="timeline-content">
                    <p class="heading">6:00 PM</p>
                    <p>Hospitality (Some food will be served)</p>
                </div>
            </div>

            <!-- Ceremony -->
            <div class="timeline-item">
                <div class="timeline-marker"></div>
                <div class="timeline-content">
                    <p class="heading">6:30 PM</p>
                    <p>Wedding Ceremony</p>
                </div>
            </div>

            <!-- Cocktail Hour -->
            <div class="timeline-item">
                <div class="timeline-marker"></div>
                <div class="timeline-content">
                    <p class="heading">7:00 PM</p>
                    <p>Cocktail Hour (More food will be served)</p>
                </div>
            </div>

            <!-- Reception -->
            <div class="timeline-item">
                <div class="timeline-marker"></div>
                <div class="timeline-content">
                    <p class="heading">8:00 PM</p>
                    <p>Reception (Dinner will be served)</p>
                </div>
            </div>

            <!-- End Time -->
            <div class="timeline-item">
                <div class="timeline-marker"></div>
                <div class="timeline-content">
                    <p class="heading">1:00 AM</p>
                    <p>Party is Over</p>
                </div>
            </div>

        </div>
    </div>
</section>

</body>
</html>
